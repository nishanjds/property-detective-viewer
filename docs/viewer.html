<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Photo Viewer — Property Detective</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: #0d1117;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      touch-action: none;
    }

    /* ── Canvas ───────────────────────────────────────────────── */
    #canvas {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    #canvas.dragging { cursor: grabbing; }

    #photo {
      max-width: none;
      max-height: none;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      transform-origin: center center;
      will-change: transform;
    }

    /* ── Top bar ──────────────────────────────────────────────── */
    #top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      z-index: 10;
      gap: 8px;
    }
    #title {
      flex: 1;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0.9;
    }
    #branding {
      color: rgba(255,255,255,0.4);
      font-size: 11px;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }

    /* ── Controls ─────────────────────────────────────────────── */
    #controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:hover  { background: rgba(255,255,255,0.25); }
    .btn:active { background: rgba(255,255,255,0.35); }
    .btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── States ───────────────────────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; color: #e6edf3; z-index: 20;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(255,255,255,0.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 0.8rem; opacity: 0.45; }

    #error {
      display: none;
      position: fixed; inset: 0;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; color: #e6edf3;
      text-align: center; padding: 32px; z-index: 20;
    }
    #error svg { opacity: 0.35; width: 44px; height: 44px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    #error h2 { font-size: 1rem; font-weight: 600; }
    #error p  { font-size: 0.82rem; opacity: 0.55; max-width: 300px; line-height: 1.5; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>Loading image…</p>
</div>

<div id="error">
  <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <h2 id="err-title">Could not load image</h2>
  <p id="err-msg">The image may have expired or is not accessible.</p>
</div>

<div id="canvas">
  <img id="photo" alt="Property photo" />
</div>

<div id="top-bar">
  <span id="title"></span>
  <span id="branding">Property Detective</span>
</div>

<div id="controls">
  <button class="btn" id="btn-zoom-in"  title="Zoom in">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </button>
  <button class="btn" id="btn-rotate-left" title="Rotate left">
    <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
  </button>
  <button class="btn" id="btn-rotate-right" title="Rotate right">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
  </button>
  <button class="btn" id="btn-zoom-out" title="Zoom out">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </button>
</div>

<script>
(function () {
  const params  = new URLSearchParams(window.location.search);
  const rawUrl  = params.get('url');
  const title   = params.get('title') || '';

  // ── State ────────────────────────────────────────────────────
  let scale = 1, minScale = 0.5, maxScale = 8;
  let tx = 0, ty = 0;           // translation in CSS px
  let rotation = 0;             // degrees, multiples of 90
  let imgW = 0, imgH = 0;       // natural image size
  let fitScale = 1;             // scale at which image fits viewport

  const canvas = document.getElementById('canvas');
  const photo  = document.getElementById('photo');

  function applyTransform() {
    photo.style.transform =
      `translate(${tx}px, ${ty}px) scale(${scale}) rotate(${rotation}deg)`;
  }

  function computeFitScale() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const rotated = rotation % 180 !== 0;
    const w = rotated ? imgH : imgW;
    const h = rotated ? imgW : imgH;
    return Math.min(vw / w, vh / h, 1);
  }

  function clampTranslation() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const rotated = rotation % 180 !== 0;
    const scaledW = (rotated ? imgH : imgW) * scale;
    const scaledH = (rotated ? imgW : imgH) * scale;
    const maxTx = Math.max(0, (scaledW - vw) / 2);
    const maxTy = Math.max(0, (scaledH - vh) / 2);
    tx = Math.max(-maxTx, Math.min(maxTx, tx));
    ty = Math.max(-maxTy, Math.min(maxTy, ty));
  }

  function zoomBy(factor, cx, cy) {
    if (cx == null) cx = window.innerWidth  / 2;
    if (cy == null) cy = window.innerHeight / 2;
    const newScale = Math.max(minScale, Math.min(maxScale, scale * factor));
    const ratio = newScale / scale;
    tx = cx - ratio * (cx - tx);
    ty = cy - ratio * (cy - ty);
    scale = newScale;
    clampTranslation();
    applyTransform();
  }

  function rotate(deg) {
    rotation = (rotation + deg + 360) % 360;
    tx = 0; ty = 0;                   // reset pan on rotation
    fitScale = computeFitScale();
    minScale = fitScale * 0.8;
    scale = fitScale;
    applyTransform();
  }

  function resetView() {
    rotation = 0;
    scale = fitScale = computeFitScale();
    minScale = fitScale * 0.8;
    tx = 0; ty = 0;
    applyTransform();
  }

  // ── Error / helpers ──────────────────────────────────────────
  function showError(h, m) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('canvas').style.display  = 'none';
    document.getElementById('top-bar').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
    const el = document.getElementById('error');
    el.style.display = 'flex';
    document.getElementById('err-title').textContent = h;
    document.getElementById('err-msg').textContent   = m;
  }

  if (!rawUrl) {
    showError('No image URL provided', 'Open this page with a ?url= query parameter.');
    return;
  }

  // ── Title ────────────────────────────────────────────────────
  if (title) document.getElementById('title').textContent = title;

  // ── Image load ───────────────────────────────────────────────
  photo.onload = function () {
    document.getElementById('loading').style.display = 'none';

    imgW = photo.naturalWidth;
    imgH = photo.naturalHeight;

    fitScale = computeFitScale();
    minScale = fitScale * 0.8;
    scale = fitScale;

    photo.style.width  = imgW + 'px';
    photo.style.height = imgH + 'px';
    applyTransform();
  };

  photo.onerror = function () {
    showError('Could not load image',
      'The image may have expired or is not publicly accessible. Try regenerating the PDF.');
  };

  photo.src = rawUrl; // URLSearchParams.get() already decodes once

  // ── Mouse wheel zoom ─────────────────────────────────────────
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomBy(factor, e.clientX, e.clientY);
  }, { passive: false });

  // ── Mouse drag pan ───────────────────────────────────────────
  let drag = null;
  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    drag = { x: e.clientX - tx, y: e.clientY - ty };
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    tx = e.clientX - drag.x;
    ty = e.clientY - drag.y;
    clampTranslation();
    applyTransform();
  });
  window.addEventListener('mouseup', function () {
    drag = null;
    canvas.classList.remove('dragging');
  });

  // ── Double-click to zoom ─────────────────────────────────────
  canvas.addEventListener('dblclick', function (e) {
    if (scale > fitScale * 1.2) {
      resetView();
    } else {
      zoomBy(2.5, e.clientX, e.clientY);
    }
  });

  // ── Touch: pinch-zoom + drag ─────────────────────────────────
  let lastTouches = null, lastDist = null, lastMid = null;

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    lastTouches = e.touches;
    if (e.touches.length === 2) {
      lastDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      lastMid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (e.touches.length === 2 && lastDist !== null) {
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY);
      const mid = {
        x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
        y: (e.touches[0].clientY + e.touches[1].clientY) / 2,
      };
      zoomBy(dist / lastDist, mid.x, mid.y);
      lastDist = dist;
      lastMid  = mid;
    } else if (e.touches.length === 1 && lastTouches && lastTouches.length === 1) {
      const dx = e.touches[0].clientX - lastTouches[0].clientX;
      const dy = e.touches[0].clientY - lastTouches[0].clientY;
      tx += dx; ty += dy;
      clampTranslation();
      applyTransform();
    }
    lastTouches = e.touches;
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) { lastDist = null; lastMid = null; }
    lastTouches = e.touches;
  }, { passive: false });

  // ── Buttons ──────────────────────────────────────────────────
  document.getElementById('btn-zoom-in').addEventListener('click',  () => zoomBy(1.5));
  document.getElementById('btn-zoom-out').addEventListener('click', () => zoomBy(1 / 1.5));
  document.getElementById('btn-rotate-left').addEventListener('click',  () => rotate(-90));
  document.getElementById('btn-rotate-right').addEventListener('click', () => rotate(90));

  // ── Resize ───────────────────────────────────────────────────
  window.addEventListener('resize', function () {
    if (!imgW) return;
    fitScale = computeFitScale();
    minScale = fitScale * 0.8;
    if (scale < fitScale) { scale = fitScale; tx = 0; ty = 0; }
    clampTranslation();
    applyTransform();
  });
})();
</script>
</body>
</html>
