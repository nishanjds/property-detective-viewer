<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360° Photo Viewer — Property Detective</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    integrity="sha384-02yn80EH0cF+s23taAmuhEZ04p3CTbQvV0QZMr2reUxajpfvcLNKlzsPkZwx14mf" crossorigin="anonymous" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"
    integrity="sha384-S5+w/JlcNAOymqXGNrvzn2F++XsaHTJdex6KE5VbKryfFgqJiRUJOgOkUqaiOZTf" crossorigin="anonymous"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0d1117; font-family: sans-serif; }

    #viewer { width: 100%; height: 100vh; }

    #error {
      display: none;
      position: fixed;
      inset: 0;
      background: #0d1117;
      color: #e6edf3;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      text-align: center;
      padding: 24px;
    }
    #error svg { opacity: 0.4; }
    #error h2 { font-size: 1.1rem; font-weight: 600; }
    #error p  { font-size: 0.85rem; opacity: 0.6; max-width: 320px; }

    #branding {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      pointer-events: none;
      letter-spacing: 0.3px;
    }
  </style>
</head>
<body>

<div id="viewer"></div>

<div id="error">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <h2 id="err-title">No image URL provided</h2>
  <p id="err-msg">Open this page with a #url= parameter pointing to a 360° equirectangular image.</p>
</div>

<div id="branding">Property Detective</div>

<script>
  (function () {
    // Links put the params in the #fragment, which is never sent to a server;
    // older PDFs used ?query, so fall back to it.
    const hash = new URLSearchParams(window.location.hash.slice(1));
    const query = new URLSearchParams(window.location.search);
    const param = (k) => hash.get(k) ?? query.get(k);
    const imageUrl = param('url');

    function showError(title, msg) {
      document.getElementById('err-title').textContent = title;
      document.getElementById('err-msg').textContent = msg;
      document.getElementById('error').style.display = 'flex';
    }

    if (!imageUrl) {
      document.getElementById('error').style.display = 'flex';
      return;
    }
    // Only the app's own photos (getDownloadURL always returns this host).
    if (!imageUrl.startsWith('https://firebasestorage.googleapis.com/')) {
      showError('Unsupported image link', 'This viewer only opens Property Detective photos.');
      return;
    }

    pannellum.viewer('viewer', {
      type: 'equirectangular',
      panorama: imageUrl, // URLSearchParams.get() already decodes once
      escapeHTML: true, // pannellum writes the title with innerHTML otherwise
      autoLoad: true,
      autoRotate: -2,
      compass: false,
      showFullscreenCtrl: true,
      showZoomCtrl: true,
      mouseZoom: true,
      title: param('title') || '',
      hotSpotDebug: false,
    });
  })();
</script>

</body>
</html>
